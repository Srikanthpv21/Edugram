services:
  postgres:
    image: postgres:16-alpine
    container_name: edugram-postgres
    environment:
      POSTGRES_USER: edugram
      POSTGRES_PASSWORD: edugram
      POSTGRES_DB: edugram
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugram"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edugram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
